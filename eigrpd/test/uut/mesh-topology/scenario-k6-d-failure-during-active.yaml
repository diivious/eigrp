schema: eigrp-uut-test/v1
name: k6-topology-change-during-active-computation
topology: ipv4-dense-mesh-k6.yaml
steps:
- start: all
- validate-convergence:
    timeout: 12
    expect:
    - route:
        uut: r1
        prefix: 10.102.0.0/24
        table: topology
        active: false
        successors: 1
        fd: 7864320
    - route:
        uut: r1
        prefix: 10.104.0.0/24
        table: path
        next_hop: 10.14.0.4
        feasible_successor: true
- fault-add:
    name: hold-r3-reply
    action: delay
    source_uut: r3
    destination_uut: r1
    opcode: reply
    delay_ms: 1500
    count: 1
- packet-mark: first-failure
- links-down:
  - uut: r1
    interface: eth12
  - uut: r2
    interface: eth21
- validate-route:
    uut: r1
    prefix: 10.102.0.0/24
    table: topology
    active: true
    timeout: 1
- validate-fault:
    name: hold-r3-reply
    hits: 1
    timeout: 2
- packet-mark: while-active
- links-down:
  - uut: r1
    interface: eth14
  - uut: r4
    interface: eth41
- validate-convergence:
    timeout: 15
    expect:
    - route:
        uut: r1
        prefix: 10.102.0.0/24
        table: topology
        active: false
        successors: 1
        fd: 9175040
