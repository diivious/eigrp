    - route:
        uut: r3
        prefix: 10.103.0.0/24
        table: topology
        active: false
    - route:
        uut: r3
        prefix: 10.104.0.0/24
        table: topology
        active: false
    - route:
        uut: r4
        prefix: 10.102.0.0/24
        table: topology
        active: false
    - route:
        uut: r4
        prefix: 10.103.0.0/24
        table: topology
        active: false
    - route:
        uut: r4
        prefix: 10.104.0.0/24
        table: topology
