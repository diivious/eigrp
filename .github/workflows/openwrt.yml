# OpenWrt setup/config/verification smoke checks. No firmware builds until the shim
# has a real package target and its QEMU/UUT gate.
name: OpenWrt Development Setup CI

on:
  push:
    paths:
      - 'tools/openwrt.sh'
      - 'openwrt/**'
      - '.github/workflows/openwrt.yml'
  pull_request:
    paths:
      - 'tools/openwrt.sh'
      - 'openwrt/**'
      - '.github/workflows/openwrt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-smoke:
    name: ${{ matrix.os }} / OpenWrt setup/config smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out EIGRP
        uses: actions/checkout@v4
      - name: Check setup syntax and safety
        shell: bash
        run: bash openwrt/test/setup-smoke.sh
