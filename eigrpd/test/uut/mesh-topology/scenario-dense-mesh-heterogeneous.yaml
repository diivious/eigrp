schema: eigrp-uut-test/v1
topology: ipv4-dense-mesh.yaml
name: Dense Mesh Core - Shared Failure Heterogeneous DUAL Outcomes
# One R1-R2 adjacency loss drives independent destination behavior at R1:
#
# 10.104.0.0/24: R2 is the initial successor (CD 8519680).  R4 advertises
#                  RD 7208960 < FD 8519680, so it is a valid FS even though
#                  the lower-CD R3 path fails FC.  R1 must remain Passive and
#                  switch directly to R4 without a QUERY.
# 10.102.0.0/24: R2 is the successor (FD 7864320).  Every alternate has
#                  RD >= FD, so FC fails and R1 must diffuse with QUERY.
# 10.103.0.0/24: R2 and R3 are equal-cost successors.  Losing R2 leaves the
#                  surviving R3 successor without a diffusing computation.
# 10.105.0.0/24: R2 is preferred and R5 is a higher-CD FS, independently
#                  exercising a second immediate failover in the same batch.
steps:
  - start: r2
  - start: r3
  - start: r4
  - start: r5
  - start: r1
  - validate-convergence:
      timeout: 8
      expect:
        - route: {uut: r1, prefix: 10.104.0.0/24, table: topology, active: false, successors: 1, fd: 8519680}
        - route: {uut: r1, prefix: 10.104.0.0/24, table: rib, next_hop: 10.12.0.2, metric: 8519680, distance: 90}
        - route: {uut: r1, prefix: 10.104.0.0/24, table: path, next_hop: 10.12.0.2, successor: true, distance: 8519680, rd: 7864320}
        - route: {uut: r1, prefix: 10.104.0.0/24, table: path, next_hop: 10.13.0.3, successor: false, feasible_successor: false, distance: 9830400, rd: 8519680}
        - route: {uut: r1, prefix: 10.104.0.0/24, table: path, next_hop: 10.14.0.4, successor: false, feasible_successor: true, distance: 12451840, rd: 7208960}

        - route: {uut: r1, prefix: 10.102.0.0/24, table: topology, active: false, successors: 1, fd: 7864320}
        - route: {uut: r1, prefix: 10.102.0.0/24, table: path, next_hop: 10.12.0.2, successor: true, distance: 7864320, rd: 7208960}
        - route: {uut: r1, prefix: 10.102.0.0/24, table: path, next_hop: 10.13.0.3, successor: false, feasible_successor: false, distance: 9175040, rd: 7864320}

        - route: {uut: r1, prefix: 10.103.0.0/24, table: topology, active: false, successors: 2, fd: 8519680}
        - route: {uut: r1, prefix: 10.103.0.0/24, table: path, next_hop: 10.12.0.2, successor: true, distance: 8519680, rd: 7864320}
        - route: {uut: r1, prefix: 10.103.0.0/24, table: path, next_hop: 10.13.0.3, successor: true, distance: 8519680, rd: 7208960}

        - route: {uut: r1, prefix: 10.105.0.0/24, table: topology, active: false, successors: 1, fd: 7864320}
        - route: {uut: r1, prefix: 10.105.0.0/24, table: path, next_hop: 10.15.0.5, successor: false, feasible_successor: true, distance: 12451840, rd: 7208960}

  - packet-mark: r1-r2-shared-failure
  - link-down: {uut: r1, interface: eth12}
  - link-down: {uut: r2, interface: eth21}

  - validate-convergence:
      timeout: 8
      expect:
        - route: {uut: r1, prefix: 10.104.0.0/24, table: topology, active: false, successors: 1, fd: 8519680}
        - route: {uut: r1, prefix: 10.104.0.0/24, table: rib, next_hop: 10.14.0.4, metric: 12451840, distance: 90}
        - route: {uut: r1, prefix: 10.104.0.0/24, table: path, next_hop: 10.14.0.4, successor: true, distance: 12451840, rd: 7208960}

        - route: {uut: r1, prefix: 10.102.0.0/24, table: topology, active: false, successors: 1, fd: 9175040}
        - route: {uut: r1, prefix: 10.102.0.0/24, table: rib, next_hop: 10.13.0.3, metric: 9175040, distance: 90}
        - route: {uut: r1, prefix: 10.102.0.0/24, table: path, next_hop: 10.13.0.3, successor: true, distance: 9175040, rd: 7864320}

        - route: {uut: r1, prefix: 10.103.0.0/24, table: topology, active: false, successors: 1, fd: 8519680}
        - route: {uut: r1, prefix: 10.103.0.0/24, table: rib, next_hop: 10.13.0.3, metric: 8519680, distance: 90}
        - route: {uut: r1, prefix: 10.103.0.0/24, table: path, next_hop: 10.13.0.3, successor: true, distance: 8519680, rd: 7208960}

        - route: {uut: r1, prefix: 10.105.0.0/24, table: topology, active: false, successors: 1, fd: 7864320}
        - route: {uut: r1, prefix: 10.105.0.0/24, table: rib, next_hop: 10.15.0.5, metric: 12451840, distance: 90}

  - validate-packet: {uut: r1, opcode: query, prefix: 10.104.0.0/24, since: r1-r2-shared-failure, min: 0, max: 0, timeout: 2}
  - validate-packet: {uut: r1, opcode: query, prefix: 10.103.0.0/24, since: r1-r2-shared-failure, min: 0, max: 0, timeout: 2}
  - validate-packet: {uut: r1, opcode: query, prefix: 10.105.0.0/24, since: r1-r2-shared-failure, min: 0, max: 0, timeout: 2}
  - validate-packet: {uut: r1, opcode: query, prefix: 10.102.0.0/24, since: r1-r2-shared-failure, min: 1, timeout: 2}

  # Recheck state after all negative QUERY observation windows complete.
  - validate-convergence:
      timeout: 2
      expect:
        - route: {uut: r1, prefix: 10.104.0.0/24, table: topology, active: false, successors: 1, fd: 8519680}
        - route: {uut: r1, prefix: 10.102.0.0/24, table: topology, active: false, successors: 1, fd: 9175040}
        - route: {uut: r1, prefix: 10.103.0.0/24, table: topology, active: false, successors: 1, fd: 8519680}
        - route: {uut: r1, prefix: 10.105.0.0/24, table: topology, active: false, successors: 1, fd: 7864320}

  - packet-mark: r1-r2-recovery
  - link-up: {uut: r2, interface: eth21}
  - link-up: {uut: r1, interface: eth12}
  - validate-neighbor: {uut: r1, neighbor: 10.12.0.2, interface: eth12, timeout: 8}
  - validate-convergence:
      timeout: 8
      expect:
        - route: {uut: r1, prefix: 10.104.0.0/24, table: topology, active: false, successors: 1, fd: 8519680}
        - route: {uut: r1, prefix: 10.104.0.0/24, table: rib, next_hop: 10.12.0.2, metric: 8519680, distance: 90}
        - route: {uut: r1, prefix: 10.102.0.0/24, table: topology, active: false, successors: 1, fd: 7864320}
        - route: {uut: r1, prefix: 10.102.0.0/24, table: rib, next_hop: 10.12.0.2, metric: 7864320, distance: 90}
        - route: {uut: r1, prefix: 10.103.0.0/24, table: topology, active: false, successors: 2, fd: 8519680}
        - route: {uut: r1, prefix: 10.105.0.0/24, table: topology, active: false, successors: 1, fd: 7864320}
