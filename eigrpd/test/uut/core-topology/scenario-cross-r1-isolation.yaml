schema: eigrp-uut-test/v1
topology: ipv4-core-cross.yaml
name: Core Topology B3 - Cross Successive Alternate Exhaustion
steps:
  - start: r4
  - start: r2
  - start: r3
  - start: r1
  - validate-convergence:
      timeout: 7
      expect:
        - route: {uut: r1, prefix: 10.4.0.0/24, table: topology, active: false, successors: 1, fd: 9175040}
        - route: {uut: r1, prefix: 10.4.0.0/24, table: rib, next_hop: 10.12.0.2, metric: 9175040}
        - route: {uut: r1, prefix: 10.4.0.0/24, table: path, next_hop: 10.14.0.4, successor: false, feasible_successor: true, distance: 9830400, rd: 7208960}
        - route: {uut: r1, prefix: 10.4.0.0/24, table: path, next_hop: 10.13.0.3, successor: false, feasible_successor: true, distance: 10485760, rd: 8519680}
  # Exhaust R1's alternates in deterministic metric order: R2 -> direct R4 -> R3.
  - packet-mark: cross-isolate-r1-r2-down
  - link-down: {uut: r1, interface: eth12}
  - link-down: {uut: r2, interface: eth21}
  - validate-convergence:
      timeout: 7
      expect:
        - route: {uut: r1, prefix: 10.4.0.0/24, table: topology, active: false, successors: 1, fd: 9175040}
        - route: {uut: r1, prefix: 10.4.0.0/24, table: rib, next_hop: 10.14.0.4, metric: 9830400}
  - validate-packet: {uut: r1, opcode: query, prefix: 10.4.0.0/24, since: cross-isolate-r1-r2-down, min: 0, max: 0, timeout: 2}
  - packet-mark: cross-isolate-r1-r4-down
  - link-down: {uut: r1, interface: eth14}
  - link-down: {uut: r4, interface: eth41}
  - validate-convergence:
      timeout: 7
      expect:
        - route: {uut: r1, prefix: 10.4.0.0/24, table: topology, active: false, successors: 1, fd: 9175040}
        - route: {uut: r1, prefix: 10.4.0.0/24, table: rib, next_hop: 10.13.0.3, metric: 10485760}
  - validate-packet: {uut: r1, opcode: query, prefix: 10.4.0.0/24, since: cross-isolate-r1-r4-down, min: 0, max: 0, timeout: 2}
  # Last R1 edge down: no stale successor/RIB state may survive.
  - packet-mark: cross-isolate-r1-r3-down
  - link-down: {uut: r1, interface: eth13}
  - link-down: {uut: r3, interface: eth31}
  - validate-convergence:
      timeout: 7
      expect:
        - route: {uut: r1, prefix: 10.4.0.0/24, table: topology, active: false, successors: 0, fd: 4294967295}
        - route: {uut: r1, prefix: 10.4.0.0/24, table: rib, present: false}
        - route: {uut: r2, prefix: 10.4.0.0/24, table: rib, next_hop: 10.24.0.4, metric: 7864320}
        - route: {uut: r3, prefix: 10.4.0.0/24, table: rib, next_hop: 10.34.0.4, metric: 8519680}
  # Recover in reverse order and verify every intermediate path, then baseline.
  - link-up: {uut: r3, interface: eth31}
  - link-up: {uut: r1, interface: eth13}
  - validate-neighbor: {uut: r1, neighbor: 10.13.0.3, interface: eth13, timeout: 7}
  - validate-convergence:
      timeout: 7
      expect:
        - route: {uut: r1, prefix: 10.4.0.0/24, table: rib, next_hop: 10.13.0.3, metric: 10485760}
  - link-up: {uut: r4, interface: eth41}
  - link-up: {uut: r1, interface: eth14}
  - validate-neighbor: {uut: r1, neighbor: 10.14.0.4, interface: eth14, timeout: 7}
  - validate-convergence:
      timeout: 7
      expect:
        - route: {uut: r1, prefix: 10.4.0.0/24, table: rib, next_hop: 10.14.0.4, metric: 9830400}
  - link-up: {uut: r2, interface: eth21}
  - link-up: {uut: r1, interface: eth12}
  - validate-neighbor: {uut: r1, neighbor: 10.12.0.2, interface: eth12, timeout: 7}
  - validate-convergence:
      timeout: 7
      expect:
        - route: {uut: r1, prefix: 10.4.0.0/24, table: topology, active: false, successors: 1, fd: 9175040}
        - route: {uut: r1, prefix: 10.4.0.0/24, table: rib, next_hop: 10.12.0.2, metric: 9175040}
        - route: {uut: r1, prefix: 10.4.0.0/24, table: path, next_hop: 10.14.0.4, successor: false, feasible_successor: true, distance: 9830400, rd: 7208960}
        - route: {uut: r1, prefix: 10.4.0.0/24, table: path, next_hop: 10.13.0.3, successor: false, feasible_successor: true, distance: 10485760, rd: 8519680}
