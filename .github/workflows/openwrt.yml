# OpenWrt host/first-stage package recipe checks. Cross-build and QEMU/UUT
# gates are added when the native daemon has real runtime targets.
name: OpenWrt Package CI

on:
  push:
    paths:
      - 'tools/openwrt.sh'
      - 'openwrt/**'
      - '.github/workflows/openwrt.yml'
  pull_request:
    paths:
      - 'tools/openwrt.sh'
      - 'openwrt/**'
      - '.github/workflows/openwrt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-test:
    name: ${{ matrix.os }} / OpenWrt feed/package test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out EIGRP
        uses: actions/checkout@v4
      - name: Run OpenWrt component and nonprivileged UUT suite
        shell: bash
        run: ./tools/openwrt.sh --uut
