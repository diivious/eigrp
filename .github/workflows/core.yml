# EIGRP portable/core CI. The root Makefile owns test orchestration.

name: EIGRP Core CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.os }} / make test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out EIGRP
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install portable test dependencies
        run: python3 -m pip install pytest PyYAML

      - name: Run portable/core gate
        shell: bash
        env:
          EIGRP_PYTHON: python3
        run: |
          set -o pipefail
          make test 2>&1 | tee make-test.log

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eigrp-core-${{ matrix.os }}-failure-log
          path: |
            make-test.log
            eigrpd/test/uut/logs/
          if-no-files-found: warn
