# OpenWrt host/first-stage package recipe checks. Cross-build and QEMU/UUT
# gates are added when the native daemon has real runtime targets.
name: OpenWrt Package CI

on:
  push:
    paths:
      - 'tools/openwrt.sh'
      - 'openwrt/**'
      - '.github/workflows/openwrt.yml'
  pull_request:
    paths:
      - 'tools/openwrt.sh'
      - 'openwrt/**'
      - '.github/workflows/openwrt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-smoke:
    name: ${{ matrix.os }} / OpenWrt feed/package smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out EIGRP
        uses: actions/checkout@v4
      - name: Check setup syntax and safety
        shell: bash
        run: bash openwrt/test/setup-smoke.sh
      - name: Check package staging and archive build recipe
        if: runner.os == 'Linux'
        shell: bash
        run: bash openwrt/test/recipe-smoke.sh
      - name: Compile and run OpenWrt runtime unit tests
        shell: bash
        run: bash openwrt/test/runtime-smoke.sh
      - name: Compile and run Linux interface netlink UUT
        if: runner.os == 'Linux'
        shell: bash
        run: bash openwrt/test/interface-smoke.sh
      - name: Compile and run Linux protocol-88 socket UUT
        if: runner.os == 'Linux'
        shell: bash
        run: bash openwrt/test/packet-smoke.sh
