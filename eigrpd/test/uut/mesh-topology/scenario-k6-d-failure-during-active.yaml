        count: 3
    - route:
        uut: r1
        prefix: 10.106.0.0/24
        table: path
        next_hop: 10.12.0.2
        present: false
    - route:
        uut: r1
        prefix: 10.106.0.0/24
        table: path
        next_hop: 10.14.0.4
        present: false
- validate-packet:
    source_uut: r1
    opcode: query
    prefix: 10.104.0.0/24
    since: while-active
    event: delivered
    min: 3
    max: 3
    group_by:
    - source_uut
    - destination_uut
    max_per_group: 1
    timeout: 1
- validate-packet:
    source_uut: r1
    opcode: query
    prefix: 10.105.0.0/24
    since: while-active
    event: delivered
    min: 0
    max: 0
